services:
  embassy-platform:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: embassy-platform-v2
    restart: unless-stopped
    ports:
      - "${PORT:-3020}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - SQLITE_PATH=/app/data/app.db
      - ALLOWED_ORIGINS=149.102.129.28:3020,149.102.129.28
    volumes:
      - embassy_data:/app/data

volumes:
  embassy_data:
    name: embassy_platform_v2_data
